# A hosted-API double (decision D8): runs as a paid asynchronous task on the
# network lane with an estimate, so the remote path is testable without a key.
id: mock-cloud
name: Mock cloud
description: Behaves like a hosted model (estimate, remote task, download) without a network call.
provider: mock-cloud
runtime: api
modes: [image, video]
capabilities: [text_to_image, multi_reference, text_to_video, native_audio]
params:
  aspect:
    type: enum
    label: Aspect ratio
    values: ["1:1", "16:9", "9:16", "4:3", "3:4"]
    default: "1:1"
    default_by_mode: { video: "16:9" }
    control: pills
  duration:
    type: integer
    label: Duration
    unit: s
    min: 2
    max: 12
    default: 4
    modes: [video]
    control: stepper
  audio:
    type: boolean
    label: Audio
    default: true
    modes: [video]
    control: toggle
  latency_seconds:
    type: number
    label: Simulated latency
    unit: s
    min: 0
    max: 600
    advanced: true
    control: slider
  force_failure:
    type: boolean
    label: Fail on purpose
    advanced: true
    control: toggle
limits:
  # References are drawn into the mock image, so the reference path is testable.
  max_references: 4
  reference_kinds: [image]
  max_batch: 4
pricing:
  unit: request
  usd: 0.01
  source_url: https://github.com/AntoBrandi/FrameStudio
  checked_at: "2026-11-13"
license:
  kind: test_double
  name: AGPL-3.0-only (part of FrameStudio)
  commercial_use: "yes"
  credit: FrameStudio contributors
  source_url: https://github.com/AntoBrandi/FrameStudio
  notes: Charges nothing; the price exists to exercise cost estimates.
tags: [test, offline]
# Auto prefers lower ranks (test doubles last, so Auto always works offline).
auto_rank: 950
prompt_profile: generic
fixtures:
  - mode: image
    params: { aspect: "4:3" }
  - mode: video
    params: { duration: 6, audio: false }
